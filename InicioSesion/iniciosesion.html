<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="iniciosesion.css" />
  </head>
  <body>
    <img
      id="logo"
      src="https://s32519.pcdn.co/wp-content/uploads/2025/05/logo.png"
      alt="Mahindra Logo"
    />
    <div class="container">
      <div class="form-box">
        <h2>Login</h2>
        <form action="/login" method="post">
          <label for="username">Username</label>
          <br />
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
          />
          <br />
          <br />
          <label for="password">Password</label>
          <br />
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
          <br />
          <br />
          <div class="button-container">
            <button
              id="buttonSubmit"
              type="button"
              onclick="window.location.href = '/Home/homepage.html'"
            >
              Login
            </button>
            <button
              id="buttonRegister"
              type="button"
              onclick="window.location.href = '/Register/register.html'"
            >
              Register
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
